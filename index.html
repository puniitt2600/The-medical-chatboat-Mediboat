<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>MediBot - Medical Assistant</title>
    <!-- CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial;
            background: linear-gradient(
                135deg,
                #dff7f8,
                #f7ffff
            );
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #008c95;
            color: white;
            padding: 22px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .language-selector {
            padding: 13px 18px;
            background: #f1fbfb;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .language-selector label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }
        #replyLanguage {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            color: #333;
            outline: none;
            cursor: pointer;
        }
        #replyLanguage:focus {
            border-color: #008c95;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9ffff;
        }
        .message {
            max-width: 82%;
            padding: 13px 16px;
            margin-bottom: 15px;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .bot {
            background: #e3f2f3;
            color: black;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .user {
            background: #008c95;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .typing {
            color: #777;
            font-style: italic;
        }
        #status {
            text-align: center;
            font-size: 12px;
            color: #777;
            padding: 5px 10px;
            min-height: 20px;
        }
        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            background: white;
            border-top: 1px solid #ddd;
        }
        #question {
            flex: 1;
            min-width: 0;
            padding: 13px 17px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }
        #question:focus {
            border-color: #008c95;
        }
        #mic-btn {
            background: #dff7f8;
            color: #008c95;
        }
        #mic-btn.listening {
            background: rgb(236, 36, 36);
            color: white;
            animation: pulse 1s infinite;
        }
         @keyframes pulse {     /*to create animations for the pulsing microphone effect */
            0% {
                box-shadow:
                    0 0 0 0
                    rgba(255, 65, 65, 0.6);
            }
            70% {
                box-shadow:
                    0 0 0 12px
                    rgba(255, 65, 65, 0);
            }
            100% {
                box-shadow:
                    0 0 0 0
                    rgba(255, 65, 65, 0);
            }
        }
        #send-btn {
            background: #008c95;
            color: white;
        }
        #clear-btn {
            background:white;
            color: #555;
        }
        .speak-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-left: 8px;
            padding: 2px;
        }
        #voice-toggle{
            background:#dff7f8;
            color:#008c95;
        }
        #voice-toggle.off{
            background:white;
            color:#777;
        }
        @media (max-width: 600px) {   /*used to make website responsive to mske it look good on phone also*/
            body {padding: 0;}
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
            .message {max-width: 90%;}
            .language-selector {padding: 12px;}
            .input-area {padding: 10px;}
            .action-btn {
                width: 42px;
                height: 42px;
                min-width: 42px;
            }
        }    
    </style>
</head>
<!-- HTML -->
<body>
<div class="chat-container">
    <div class="header">
        <h1>🩺 MediBot</h1>
        <p> Your Medical AI Assistant</p>
    </div>
    <div class="language-selector">
        <label for="replyLanguage">
            🌐 Reply in:
        </label>
        <select id="replyLanguage">
            <option value="English">
                English
            </option>
            <option value="Hindi">
                हिंदी
            </option>
            <option value="Bengali">
                বাংলা
            </option>
            <option value="Tamil">
                தமிழ்
            </option>
            <option value="Telugu">
                తెలుగు
            </option>
            <option value="Marathi">
                मराठी
            </option>
            <option value="Gujarati">
                ગુજરાતી
            </option>
            <option value="Kannada">
                ಕನ್ನಡ
            </option>
            <option value="Malayalam">
                മലയാളം
            </option>
            <option value="Punjabi">
                ਪੰਜਾਬੀ
            </option>
        </select>
    </div>
    <div id="chat-box">
        <div class="message bot">
            Hello! 👋
            <br/>
            I am <b>MediBot</b>, your medical
            AI assistant.
        </div>
    </div>
    <div id="status"></div>
    <div class="input-area">
        <input
            type="text"
            id="question"
            placeholder="Ask a medical question...">
        <button
            id="mic-btn"
            title="Voice input">
            🎤
        </button>
        <button
            id="send-btn"
            title="Send message">
            ➤
        </button>
        <button
            id="clear-btn"
            title="Clear input">
            🗑️
        </button>
        <button
            id="voice-toggle"
            title="turn voice reply on/off">
            🔊
        </button>
    </div>
</div>
<!-- JS  -->
<script>
 const API_URL = "/chat";  //const is used to create a variable and store the html element wth id to use it later
const questionInput =
    document.getElementById("question");
const chatBox =
    document.getElementById("chat-box");
const micButton =
    document.getElementById("mic-btn");
const sendButton =
    document.getElementById("send-btn");
const clearButton =
    document.getElementById("clear-btn");
const replyLanguage =
    document.getElementById("replyLanguage");
const statusText =
    document.getElementById("status");
const voiceToggle=
    document.getElementById("voice-toggle");
    let voiceEnabled=false;
    let lastBotAnswer="";
function addMessage(text, sender) {
    const message =
    document.createElement("div");
    message.classList.add("message",sender );
    message.innerText = text;
    chatBox.appendChild(message);
    chatBox.scrollTop =
        chatBox.scrollHeight;
    return message;
}
// AUDIO OUTPUT ON/OFF FUNCTIONALITY
voiceToggle.addEventListener("click", function () {
    voiceEnabled = !voiceEnabled;
    if (voiceEnabled) {
        // Change button to ON
        voiceToggle.innerText = "🔊";
        voiceToggle.title ="Turn voice reply off";
        voiceToggle.classList.remove("off");
        statusText.innerText ="🔊 Voice reply ON";
        // Speak the latest answer immediately
        if (lastBotAnswer !== "") {
            speakText( lastBotAnswer, replyLanguage.value);
        }
    } else {
        // Change button to OFF
        voiceToggle.innerText = "🔇";
        voiceToggle.title ="Turn voice reply on";
        voiceToggle.classList.add("off");
        // Stop speech immediately
        window.speechSynthesis.cancel();
        statusText.innerText = "🔇 Voice reply OFF";
    }
});
// SEND FUNCTION
async function sendQuestion() {
    const question = questionInput.value.trim();
    if (question === "") {
        return; }
    addMessage(question, "user");
    questionInput.value = "";
    const selectedLanguage=replyLanguage.value;
    const typing = addMessage("MediBot is thinking...","bot");
    try {
        const response = await fetch("http://127.0.0.1:8000/chat",{
                method: "POST",
                headers: {"Content-Type": "application/json" },
                body: JSON.stringify({
                    message: question,
                    reply_language:selectedLanguage
                })
            }
        );
        console.log("Status:", response.status);
        const data = await response.json();
        console.log("Response:", data);
        typing.remove();
        if (!response.ok) {
            throw new Error(
                data.detail || "Server error");
        }
        addMessage( data.answer,"bot");
        lastBotAnswer=data.answer;
        if(voiceEnabled){
        speakText(data.answer,selectedLanguage);}
    } catch (error) {
        typing.remove();
        console.error(error);
        addMessage( "❌ Connection error: " + error.message,"bot");
    }
}
//CLEAR BUTTON
clearButton.addEventListener("click",function(){   // function work after user click the button
    questionInput.value="";
    questionInput.focus();
});
// SEND BUTTON
sendButton.addEventListener("click",sendQuestion);
// ENTER KEY
questionInput.addEventListener("keydown",
    function(event) {
        if (event.key === "Enter") {
            sendQuestion();
        }
    }
);
// SPEECH RECOGNITION
const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition; // browser specific name used by browsers for the web speech recognition API
if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    // English speech recognition
    recognition.lang = "en-IN";
    // MIC BUTTON
    micButton.addEventListener("click", () => {
        try {
            recognition.start();
        } catch (error) {
            console.log("Microphone already running");
        }
    });
    // START LISTENING
    recognition.onstart = () => {
        micButton.innerHTML = "🔴";
        micButton.classList.add("listening");
        statusText.innerText = "🎤 Listening... Speak now.";
    };
    // SPEECH RESULT
    recognition.onresult = (event) => {
        const text =event.results[0][0].transcript;
        console.log("Recognized:", text);
        questionInput.value = text;
        statusText.innerText = "✅ Speech converted to text.";
    };
    // STOP LISTENING
    recognition.onend = () => {
        micButton.innerHTML = "🎤"
        micButton.classList.remove("listening");
    };
    // SPEECH ERROR
    recognition.onerror = (event) => {
        console.log("Speech recognition error:",event.error );
        micButton.innerHTML = "🎤";
        micButton.classList.remove("listening");
        if (event.error === "not-allowed") {
            statusText.innerText ="Please allow microphone access.";
        }
        else if (event.error === "no-speech") {
            statusText.innerText ="❌ No speech detected. Please try again.";
        }
        else {
            statusText.innerText ="❌ Microphone error: " +event.error;
        }
    };
}
// BROWSER DOES NOT SUPPORT MIC
else {
    micButton.addEventListener("click", () => {
        alert("Voice recognition is not supported in this browser. Please use Google Chrome.");
    });
}
// TEXT TO SPEECH
function speakText(text,language) {
    // Check browser support
    if (!("speechSynthesis"in window )) {
        alert( "Voice output is not supported.");
        return;
    }
    // Stop existing speech
    window.speechSynthesis.cancel();
    // Create speech
    const speech = new SpeechSynthesisUtterance(text)
    // LANGUAGE CODEs
    const voiceLanguages = {
        "English": "en-IN",
        "Hindi": "hi-IN",
        "Bengali": "bn-IN",
        "Tamil": "ta-IN",
        "Telugu": "te-IN",
        "Marathi": "mr-IN",
        "Gujarati": "gu-IN",
        "Kannada": "kn-IN",
        "Malayalam": "ml-IN",
        "Punjabi": "pa-IN"
    };
    speech.lang = voiceLanguages[language ] || "en-IN";
    speech.rate =0.9;
    speech.pitch = 1;
    // Speak
    window.speechSynthesis.speak(speech);
}
// LANGUAGE CHANGE
replyLanguage.addEventListener( "change", function() {
        statusText.innerText = "Reply language: " +replyLanguage.value;
    }
);
</script>
</body>
</html>
